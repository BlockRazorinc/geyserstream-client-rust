[package]
name = "geyserstream-client-rust"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "example"
path = "src/example.rs"

[dependencies]
anyhow = "1.0.0"
futures = "0.3.24"
tonic = { version = "0.14", features = ["zstd", "gzip", "tls-native-roots", "tls-ring"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
protobuf-src = "1.1.0"
solana-signature = "2.0.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1.17"

[build-dependencies]
tonic-prost-build = "0.14"
